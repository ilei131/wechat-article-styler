<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>公众号文章美化工具 · 六套主题</title>
  <meta name="description" content="免费、纯前端的微信公众号文章排版工具。六套杂志级主题，实时预览，一键复制到公众号。" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./favicon.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="./favicon.svg" alt="公众号文章美化工具 logo" width="38" height="38" />
      <div><strong>公众号文章美化工具</strong><span>本地处理 · 无需登录</span></div>
    </div>
    <div class="top-actions"><span class="privacy"><i></i> 内容仅在本机处理</span></div>
  </header>

  <main class="app-shell">
    <section class="workspace">
      <aside class="editor-panel panel">
        <div class="panel-heading">
          <div><span class="step">01</span><h2>文章内容</h2></div>
          <button class="text-button" id="loadSample">载入示例</button>
        </div>

        <label class="field-label" for="articleTitle">文章标题</label>
        <input class="text-input" id="articleTitle" type="text" placeholder="例如：AI 正在从聊天走向==执行==" spellcheck="false" />
        <p class="field-tip">标题里用 <code>==关键词==</code> 可以标记主题色高亮词。</p>

        <div class="field-grid">
          <div>
            <label class="field-label" for="articleSubtitle">副标题</label>
            <input class="text-input" id="articleSubtitle" type="text" placeholder="一句话说明这篇文章" spellcheck="false" />
          </div>
          <div>
            <label class="field-label" for="articleAuthor">作者</label>
            <input class="text-input" id="articleAuthor" type="text" placeholder="署名（可留空）" spellcheck="false" />
          </div>
        </div>

        <div class="input-label-row">
          <label class="field-label" for="articleBody">正文内容</label>
          <span id="charCount">0 字</span>
        </div>
        <textarea id="articleBody" spellcheck="false" placeholder="在这里粘贴文章正文。&#10;&#10;支持 Markdown：&#10;# 一级标题 / ## 章节 / ### 小节&#10;**加粗**  ==高亮==  ++下划线++&#10;> 引用    > [!TIP] 提示&#10;- 无序列表  1. 有序列表&#10;``` 代码块 ```   表格   ![说明](图片地址)"></textarea>

        <div class="hint">
          <span class="hint-icon">✦</span>
          <span id="hintText">支持标题、引用、列表、代码块、表格、图片；<code>**加粗**</code>、<code>==高亮==</code>、<code>++下划线++</code>、<code>~~删除线~~</code>。</span>
        </div>

        <div class="editor-actions">
          <button class="btn btn-quiet" id="clearBtn">清空</button>
          <button class="btn btn-primary" id="formatBtn">美化文章 <span>→</span></button>
        </div>
      </aside>

      <section class="preview-panel panel">
        <div class="panel-heading preview-heading">
          <div><span class="step">02</span><h2>主题与预览</h2></div>
          <span class="live-status"><i></i> 实时预览</span>
        </div>

        <div class="theme-picker" id="themePicker"></div>

        <div class="preview-toolbar">
          <span>手机阅读效果 · <b id="previewThemeName">摸鱼绿</b></span>
          <span class="phone-icon">▯</span>
        </div>

        <div class="phone-stage">
          <div id="preview" class="wechat-article"></div>
        </div>

        <div class="preview-options">
          <label class="switch"><input type="checkbox" id="coverToggle" checked /><span class="switch-track"></span><span class="switch-label">标题</span></label>
          <label class="switch"><input type="checkbox" id="tocToggle" checked /><span class="switch-track"></span><span class="switch-label">导读目录</span></label>
          <label class="switch"><input type="checkbox" id="ctaToggle" checked /><span class="switch-track"></span><span class="switch-label">文末互动</span></label>
          <span class="option-note">切换主题会保留你的内容</span>
        </div>

        <div class="export-actions">
          <button class="btn btn-primary copy-rich" id="copyRichBtn">复制排版内容 <span>↗</span></button>
          <button class="btn btn-outline" id="copyHtmlBtn">复制 HTML</button>
          <button class="btn btn-outline" id="downloadBtn">导出 HTML</button>
        </div>
        <p class="copy-note">推荐点击「复制排版内容」，再粘贴到微信公众号图文编辑器。所有样式已内联并做微信兼容处理；不同浏览器效果可能略有差异。</p>
      </section>
    </section>
    <footer>公众号文章美化工具 <span>·</span> 主题设计参考 gzh-design-skill · 文章内容不会上传到服务器。</footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./themes.js"></script>
  <script src="./renderer.js"></script>
  <script src="./app.js"></script>
</body>
</html>
